<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Berber Randevu</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#16120E; --panel:#211B15; --panel2:#2B241C; --line:#3A3128;
  --brass:#C79A3C; --brassSoft:#E8CE92; --bone:#F3EDE2; --muted:#9C9084;
  --red:#C0483A; --green:#79A05F;
}
body{background:var(--ink);color:var(--bone);font-family:'Barlow',system-ui,sans-serif;min-height:100vh;padding-bottom:48px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.head{border-bottom:1px solid var(--line);padding:22px 0 18px;margin-bottom:22px}
.kicker{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.28em;color:var(--brass);text-transform:uppercase}
.head h1{font-size:30px;line-height:1.1;margin-top:6px}
.head p{color:var(--muted);font-size:14px;margin-top:8px}
.step{margin-bottom:26px}
.steplbl{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stepno{font-family:'Oswald',sans-serif;font-size:11px;color:var(--ink);background:var(--brass);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.steplbl .t{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.svc{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.15s;color:inherit;font:inherit}
.svc:hover{border-color:var(--brass)}
.svc.on{border-color:var(--brass);background:var(--panel2);box-shadow:inset 3px 0 0 var(--brass)}
.svc .nm{font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:.03em}
.svc .meta{font-size:12px;color:var(--muted);margin-top:2px}
.svc .pr{font-family:'Oswald',sans-serif;color:var(--brassSoft);font-size:16px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.day{flex:0 0 auto;width:60px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 0;text-align:center;cursor:pointer;color:inherit;font:inherit;transition:.15s}
.day .d1{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.day .d2{font-family:'Oswald',sans-serif;font-size:20px;margin:2px 0}
.day .d3{font-size:10px;color:var(--muted)}
.day.on{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.day.on .d1,.day.on .d3{color:rgba(22,18,14,.75)}
.day.kapali{opacity:.42;cursor:not-allowed}
.day.kapali .d3{color:var(--red)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 4px;font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.04em;cursor:pointer;color:var(--bone);transition:.15s}
.slot:hover{border-color:var(--brass)}
.slot.on{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.slot.dolu{cursor:not-allowed;color:var(--muted);border-color:#33291F;background-image:repeating-linear-gradient(45deg,rgba(192,72,58,.22) 0 5px,transparent 5px 11px)}
.slot .x{display:block;font-family:'Barlow',sans-serif;font-size:9px;letter-spacing:.16em;color:var(--red);text-transform:uppercase}
.inp{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--bone);font:inherit;font-size:15px;margin-bottom:9px}
.inp:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass)}
.lbl{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.btn{width:100%;background:var(--brass);color:var(--ink);border:none;border-radius:8px;padding:14px;font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:.15s}
.btn:hover{background:var(--brassSoft)}
.btn:disabled{background:#453B2E;color:#8A8074;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--bone)}
.btn.ghost:hover{border-color:var(--brass);background:transparent}
.btn.dngr{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn.dngr:hover{background:var(--red);color:var(--bone)}
.btn.sm{padding:9px 12px;font-size:12px;width:auto}
.row{display:flex;gap:8px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.warn{border-left:2px solid var(--red);padding-left:10px;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{flex:0 0 auto;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:10px 10px 9px;cursor:pointer}
.tab.on{color:var(--brass);border-bottom-color:var(--brass)}
.ap{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.ap.pending{border-left-color:var(--brass)}
.ap.confirmed{border-left-color:var(--green)}
.ap.cancelled{border-left-color:var(--red);opacity:.5}
.ap .tm{font-family:'Oswald',sans-serif;font-size:19px;line-height:1;min-width:52px}
.ap .tm small{display:block;font-size:10px;color:var(--muted);font-family:'Barlow';letter-spacing:.06em;margin-top:3px}
.ap .nm{font-weight:600;font-size:15px}
.ap .sb{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--muted);margin-top:5px}
.chip.b{color:var(--brass);border-color:var(--brass)}
.chip.o{color:var(--green);border-color:var(--green)}
.chip.i{color:var(--red);border-color:var(--red)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:'Oswald',sans-serif;font-size:24px;color:var(--brassSoft);margin-top:4px;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.tr:last-child{border-bottom:none}
.tr b{font-family:'Oswald',sans-serif;color:var(--brassSoft);font-weight:500;text-align:right;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{text-align:center;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:4px 0}
.cd{aspect-ratio:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:inherit;font:inherit}
.cd .n{font-family:'Oswald',sans-serif;font-size:15px}
.cd .dot{width:4px;height:4px;border-radius:50%;background:var(--brass);margin-top:3px}
.cd.on{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.cd.on .dot{background:var(--ink)}
.cd.bos{background:transparent;border-color:transparent;cursor:default}
.cd.kapali{opacity:.35}
.modal{position:fixed;inset:0;background:rgba(10,8,6,.82);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:20px 16px 26px;width:100%;max-width:720px;max-height:88vh;overflow-y:auto}
.footlink{text-align:center;margin-top:38px;padding-top:18px;border-top:1px solid var(--line)}
.footlink button{background:none;border:none;color:#6C6156;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-family:'Oswald',sans-serif;cursor:pointer;padding:6px}
.footlink button:hover{color:var(--brass)}
.ozet{border:1px solid var(--brass);border-radius:12px;padding:20px;background:var(--panel2)}
.ozet .ok{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.22em;color:var(--brass);text-transform:uppercase}
.ozet h2{font-size:24px;margin:8px 0 16px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="wrap" style="padding-top:60px"><p class="note"><span class="spin"></span>Yükleniyor…</p></div></div>

<script type="module">
/* =========================================================
   1) YAPILANDIRMA
   ========================================================= */
const FB = {
  apiKey:            "AIzaSyB1cx17pHui7vXDYRz_4rEzycBXW3pVZW0",
  authDomain:        "omer-berber.firebaseapp.com",
  projectId:         "omer-berber",
  storageBucket:     "omer-berber.firebasestorage.app",
  messagingSenderId: "935274412163",
  appId:             "1:935274412163:web:e393326ed9e414043503b6"
};
const RECAPTCHA_SITE_KEY = "6Le5DIQtAAAAAOtBTnmJfEqcORAMksmTMp_HSMvc";

/* Bot koruması: "v3" | "enterprise" | "kapali" */
const RECAPTCHA_TIP = "v3";

/* Berber sadece şifre yazar; e-posta burada sabit durur ve gizli değildir. */
const BERBER_MAIL = "handigitaltr@gmail.com";

/* Aydınlatma metninde görünecek iletişim adresi */
const KVKK_EPOSTA = "handigitaltr@gmail.com";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc,
         query, where, orderBy, limit, serverTimestamp, writeBatch, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
         updatePassword, EmailAuthProvider, reauthenticateWithCredential }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* =========================================================
   2) YARDIMCILAR
   ========================================================= */
const GUNLER = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const GUN_KISA = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

const $ = (s) => document.querySelector(s);
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseYmd = (s) => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const toMin = (t) => { const [h,m]=t.split(":").map(Number); return h*60+m; };
const fromMin = (m) => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const trTarih = (s) => { const d=parseYmd(s); return `${d.getDate()} ${AYLAR[d.getMonth()]} ${d.getFullYear()}, ${GUNLER[d.getDay()]}`; };
const trKisa = (s) => { const d=parseYmd(s); return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`; };
const tl = (n) => new Intl.NumberFormat("tr-TR").format(Math.round(n||0)) + " ₺";
const saatMetni = (dk) => { const h=Math.floor(dk/60), m=dk%60; return m ? `${h} sa ${m} dk` : `${h} sa`; };
const bugun = () => ymd(new Date());

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function gecenGun(t){
  const b=new Date(); b.setHours(0,0,0,0);
  const f=Math.round((b-parseYmd(t))/86400000);
  if(f===0) return "bugün"; if(f===1) return "dün";
  if(f<0) return `${-f} gün sonra`;
  if(f<30) return `${f} gün önce`;
  if(f<365) return `${Math.round(f/30)} ay önce`;
  return `${Math.floor(f/365)} yıl önce`;
}

/* =========================================================
   3) FIREBASE
   ========================================================= */
const kurulu = !FB.apiKey.includes("BURAYA");
let db, auth;

if (kurulu) {
  const app = initializeApp(FB);
  if (RECAPTCHA_TIP !== "kapali" && !RECAPTCHA_SITE_KEY.includes("BURAYA")) {
    try {
      initializeAppCheck(app, {
        provider: RECAPTCHA_TIP === "v3"
          ? new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY)
          : new ReCaptchaEnterpriseProvider(RECAPTCHA_SITE_KEY),
        isTokenAutoRefreshEnabled: true
      });
    } catch(e){ console.error("App Check başlatılamadı:", e); }
  }
  db   = getFirestore(app);
  auth = getAuth(app);
}

/* =========================================================
   4) DURUM
   ========================================================= */
const S = { ekran:"musteri", hizmetler:[], saatler:{}, gunler:{}, dukkan:"Berber", randevular:[], admin:false, hazir:false };
const M = { hizmetId:null, tarih:null, saat:null, slotlar:[], slotYukleniyor:false, ad:"", soyad:"", tel:"", kvkk:false, ozet:null, gonderiliyor:false, hata:"", kvkkAcik:false };
const B = { sekme:"bugun", secili:bugun(), detay:null, ay:new Date(new Date().getFullYear(), new Date().getMonth(), 1), ekleAcik:false, mGorunum:"kisi", ara:"", acikKisi:null, bas:"", bit:"", sifirlaMod:null };
{ const b=new Date(); B.bas=ymd(new Date(b.getFullYear(),b.getMonth(),1)); B.bit=ymd(new Date(b.getFullYear(),b.getMonth()+1,0)); }

/* =========================================================
   5) VERİ OKUMA
   ========================================================= */
async function acikVeriYukle(){
  const bg = bugun();
  const [hs, sh, dk, gn] = await Promise.all([
    getDocs(query(collection(db,"services"), where("active","==",true))),
    getDocs(collection(db,"workingHours")),
    getDocs(collection(db,"shop")),
    getDocs(query(collection(db,"days"), where("date",">=",bg), orderBy("date"), limit(120)))
  ]);
  S.hizmetler = hs.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
  S.saatler = {}; sh.docs.forEach(d => S.saatler[Number(d.id)] = d.data());
  S.gunler = {}; gn.docs.forEach(d => S.gunler[d.id] = d.data());
  const ayar = dk.docs.find(d=>d.id==="settings");
  if (ayar) S.dukkan = ayar.data().name || "Berber";
}

async function gunleriUret(adet=120){
  const b = new Date(); b.setHours(0,0,0,0);
  for (let i=0; i<adet; i+=200){
    const batch = writeBatch(db);
    for (let j=i; j<Math.min(i+200, adet); j++){
      const d = new Date(b); d.setDate(b.getDate()+j);
      const key = ymd(d);
      const s = S.saatler[d.getDay()] || {closed:true, open:"09:00", close:"20:00"};
      const mevcut = S.gunler[key];
      if (mevcut?.manuel) continue;
      const yeni = { date:key, closed:!!s.closed, open:s.open, close:s.close, manuel:false };
      S.gunler[key] = yeni;
      batch.set(doc(db,"days",key), yeni);
    }
    await batch.commit();
  }
}

let randevuAbonelik = null;
function randevulariDinle(){
  const yilOnce = new Date(); yilOnce.setFullYear(yilOnce.getFullYear()-1);
  const q1 = query(collection(db,"appointments"), where("date",">=", ymd(yilOnce)), orderBy("date"));
  if (randevuAbonelik) randevuAbonelik();
  randevuAbonelik = onSnapshot(q1, (snap) => {
    S.randevular = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if (S.ekran==="berber" && ["bugun","takvim","musteriler"].includes(B.sekme)) ciz();
  }, (e) => console.error(e));
}

/* =========================================================
   6) ÇİZİM
   ========================================================= */
function ciz(){
  if (!kurulu) { $("#app").innerHTML = kurulumEkrani(); return; }
  if (!S.hazir) return;
  let html = "";
  if (S.ekran === "musteri") html = musteriEkrani();
  else if (S.ekran === "giris") html = girisEkrani();
  else html = berberEkrani();
  $("#app").innerHTML = html;
}

function kurulumEkrani(){
  return `<div class="wrap" style="padding-top:50px">
    <div class="kicker">Kurulum gerekli</div>
    <h1 style="font-size:24px;margin:8px 0 14px">Firebase bağlanmamış</h1>
    <p class="note">index.html dosyasının başındaki <b>FB</b> nesnesine Firebase ayarlarını yapıştırın.</p>
  </div>`;
}

/* ---------- KVKK AYDINLATMA METNİ ---------- */
function kvkkModal(){
  return `<div class="modal" data-act="kvkk-kapat"><div class="sheet" data-act="hicbirsey">
    <div class="kicker">Aydınlatma metni</div>
    <h2 style="font-size:20px;margin:8px 0 14px">Kişisel verilerin korunması</h2>
    <div class="note" style="line-height:1.65">
      <p style="margin-bottom:10px"><b style="color:var(--bone)">Veri sorumlusu:</b> ${esc(S.dukkan)} ·
      İletişim: ${esc(KVKK_EPOSTA)}</p>

      <p style="margin-bottom:10px"><b style="color:var(--bone)">Hangi veriler işleniyor?</b>
      Ad soyad ve telefon numaranız. Bunlara ek olarak seçtiğiniz hizmet, tarih ve saat bilgisi kaydedilir.</p>

      <p style="margin-bottom:10px"><b style="color:var(--bone)">Neden işleniyor?</b>
      Yalnızca randevunuzun oluşturulması, onaylanması, gerektiğinde sizinle iletişime geçilmesi ve
      dükkânın randevu geçmişini takip etmesi için. Pazarlama amacıyla kullanılmaz, üçüncü kişilerle

      <p style="margin-bottom:10px"><b style="color:var(--bone)">Hukuki sebep:</b>
      KVKK m.5/2-c uyarınca sözleşmenin kurulması ve ifası, ayrıca m.5/2-f uyarınca veri sorumlusunun
      meşru menfaati.</p>

      <p style="margin-bottom:10px"><b style="color:var(--bone)">Nerede saklanıyor?</b>
      Kayıtlar Google Firebase altyapısında tutulur. Randevu bilgileriniz diğer müşterilere görünmez;
      ad ve telefon yalnızca dükkân sahibinin şifreli panelinde görüntülenebilir.</p>

      <p style="margin-bottom:10px"><b style="color:var(--bone)">Ne kadar süre saklanıyor?</b>
      Randevu geçmişi en fazla 12 ay saklanır, sonrasında silinir.</p>

      <p style="margin-bottom:10px"><b style="color:var(--bone)">Haklarınız:</b>
      KVKK m.11 uyarınca verilerinize erişme, düzeltilmesini veya silinmesini isteme ve işlemeye itiraz
      etme hakkınız vardır. Talebinizi yukarıdaki e-posta adresine ya da doğrudan dükkâna iletebilirsiniz.</p>
    </div>
    <button class="btn" style="margin-top:14px" data-act="kvkk-kapat">Okudum, kapat</button>
  </div></div>`;
}

/* ---------- MÜŞTERİ ---------- */
function musteriEkrani(){
  if (M.ozet) return ozetEkrani();
  const h = S.hizmetler.find(x=>x.id===M.hizmetId);
  const gunler = Array.from({length:14},(_,i)=>{
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+i);
    const g=d.getDay();
    return {key:ymd(d), d, g, kapali: S.gunler[ymd(d)]?.closed !== false};
  });

  return `<div class="wrap">
    <header class="head">
      <div class="kicker">Randevu · Tek koltuk</div>
      <h1>${esc(S.dukkan)}</h1>
      <p>Hizmeti ve saati seçin, adınızı bırakın. Onay berberden gelir.</p>
    </header>

    <section class="step">
      <div class="steplbl"><span class="stepno">1</span><span class="t">Hizmet</span></div>
      ${S.hizmetler.length===0 ? `<p class="note">Şu an tanımlı hizmet yok.</p>` :
        S.hizmetler.map(x=>`
        <button class="svc ${M.hizmetId===x.id?"on":""}" data-act="hizmet" data-id="${x.id}">
          <span><span class="nm">${esc(x.name)}</span><span class="meta">${x.minutes} dakika</span></span>
          <span class="pr">${tl(x.price)}</span>
        </button>`).join("")}
    </section>

    ${!h ? "" : `
    <section class="step">
      <div class="steplbl"><span class="stepno">2</span><span class="t">Gün</span></div>
      <div class="days">
        ${gunler.map(g=>`
          <button class="day ${M.tarih===g.key?"on":""} ${g.kapali?"kapali":""}" data-act="gun" data-key="${g.key}" ${g.kapali?"disabled":""}>
            <div class="d1">${GUN_KISA[g.g]}</div>
            <div class="d2">${g.d.getDate()}</div>
            <div class="d3">${g.kapali?"Kapalı":AYLAR[g.d.getMonth()].slice(0,3)}</div>
          </button>`).join("")}
      </div>
      <p class="warn" style="margin-top:12px">Kapalı günlerde randevu alınamaz.</p>
    </section>`}

    ${!(h && M.tarih) ? "" : `
    <section class="step">
      <div class="steplbl"><span class="stepno">3</span><span class="t">Saat</span></div>
      ${M.slotYukleniyor ? `<p class="note"><span class="spin"></span>Saatler getiriliyor…</p>` :
        M.hata ? `<p class="warn">${esc(M.hata)}</p>` :
        M.slotlar.length===0 ? `<p class="note">Bu gün için uygun saat yok.</p>` :
        M.slotlar.every(s=>!s.free) ? `<p class="note">Bu günün tamamı dolu. Başka bir gün seçin.</p>` :
        `<div class="slots">${M.slotlar.map(s=>`
          <button class="slot ${M.saat===s.time?"on":""} ${s.free?"":"dolu"}" data-act="saat" data-t="${s.time}" ${s.free?"":"disabled"}>
            ${s.time}${s.free?"":'<span class="x">Dolu</span>'}
          </button>`).join("")}</div>`}
    </section>`}

    ${!(h && M.tarih && M.saat) ? "" : `
    <section class="step">
      <div class="steplbl"><span class="stepno">4</span><span class="t">Bilgileriniz</span></div>
      <div class="row">
        <div style="flex:1"><label class="lbl" for="i-ad">Ad</label>
          <input id="i-ad" class="inp" value="${esc(M.ad)}" placeholder="Adınız" autocomplete="given-name"></div>
        <div style="flex:1"><label class="lbl" for="i-soyad">Soyad</label>
          <input id="i-soyad" class="inp" value="${esc(M.soyad)}" placeholder="Soyadınız" autocomplete="family-name"></div>
      </div>
      <label class="lbl" for="i-tel">Telefon</label>
      <input id="i-tel" class="inp" value="${esc(M.tel)}" inputmode="tel" placeholder="05xx xxx xx xx" autocomplete="tel">
      <label style="display:flex;gap:9px;align-items:flex-start;margin:4px 0 12px;font-size:13px;color:var(--muted);line-height:1.45">
        <input type="checkbox" id="i-kvkk" ${M.kvkk?"checked":""} style="margin-top:3px">
        <span>Adımın ve telefon numaramın randevu takibi için saklanmasını kabul ediyorum.
          <button data-act="kvkk-ac" style="background:none;border:none;padding:0;color:var(--brass);
            text-decoration:underline;cursor:pointer;font:inherit">Aydınlatma metni</button></span>
      </label>
      <div class="card" style="margin-bottom:12px">
        <div class="tr"><span>${esc(h.name)}</span><b>${M.saat} – ${fromMin(toMin(M.saat)+h.minutes)}</b></div>
        <div class="tr"><span>${trTarih(M.tarih)}</span><b>${tl(h.price)}</b></div>
      </div>
      ${M.hata ? `<p class="warn" style="margin-bottom:10px">${esc(M.hata)}</p>` : ""}
      <button class="btn" id="b-gonder" data-act="gonder" ${M.gonderiliyor?"disabled":""}>
        ${M.gonderiliyor?'<span class="spin"></span>Gönderiliyor…':"Randevuyu gönder"}
      </button>
    </section>`}

    <div class="footlink"><button data-act="giris-ac">Yönetici girişi</button></div>
    ${M.kvkkAcik ? kvkkModal() : ""}
  </div>`;
}

function ozetEkrani(){

  return `<div class="wrap" style="padding-top:40px"><div class="ozet">
    <div class="ok">Randevu alındı</div>
    <h2>${esc(o.name)}</h2>
    <div class="tr"><span>Hizmet</span><b>${esc(o.serviceName)}</b></div>
    <div class="tr"><span>Tarih</span><b>${trTarih(o.date)}</b></div>
    <div class="tr"><span>Saat</span><b>${o.time} – ${fromMin(toMin(o.time)+o.minutes)}</b></div>

    <div class="tr"><span>Ücret</span><b>${tl(o.price)}</b></div>

    Ekran görüntüsü alabilirsiniz.</p>
    <button class="btn" style="margin-top:14px" data-act="ozet-kapat">Kapat</button>
  </div></div>`;
}

    <h1 style="font-size:26px;margin:6px 0 18px">Panel girişi</h1>

    <input id="i-sifre" class="inp" type="password" autocomplete="current-password" autofocus>

/* ---------- BERBER ---------- */
const SEKMELER = [["bugun","Bugün"],["takvim","Takvim"],["rapor","Rapor"],["mesai","Mesai"],["musteriler","Müşteriler"],["ayar","Ayarlar"],["sifirla","Sıfırla"]];

function berberEkrani(){
  let ic = "";
  if (B.sekme==="bugun") ic = gunPaneli(bugun());
  else if (B.sekme==="takvim") ic = takvimPaneli();
  else if (B.sekme==="rapor") ic = raporPaneli();
  else if (B.sekme==="mesai") ic = mesaiPaneli();
  else if (B.sekme==="musteriler") ic = musteriPaneli();
  else if (B.sekme==="ayar") ic = ayarPaneli();
  else ic = sifirlaPaneli();

  return `<div class="wrap">
    <header class="head" style="display:flex;justify-content:space-between;align-items:flex-end">
      <div><div class="kicker">Yönetici paneli</div><h1 style="font-size:24px">${esc(S.dukkan)}</h1></div>
      <button class="btn ghost sm" data-act="cikis">Çıkış</button>
    </header>
    <div class="tabs">${SEKMELER.map(([k,l])=>`<button class="tab ${B.sekme===k?"on":""}" data-act="sekme" data-k="${k}">${l}</button>`).join("")}</div>
    ${ic}
    ${B.detay ? detayModal() : ""}
    ${B.sifirlaMod ? sifirlaModal() : ""}
  </div>`;
}

const aktif = (r) => r.status !== "cancelled";

function randevuSatir(r){
  const cls = r.status==="confirmed"?"confirmed":r.status==="cancelled"?"cancelled":"pending";
  const chip = r.status==="confirmed"?["o","Onaylı"]:r.status==="cancelled"?["i","İptal"]:["b","Onay bekliyor"];
  return `<button class="ap ${cls}" data-act="detay" data-id="${r.id}">
    <div class="tm">${r.time}<small>${r.minutes} dk</small></div>
    <div style="flex:1">
      <div class="nm">${esc(r.name)}</div>
      <div class="sb">${esc(r.serviceName)} · ${tl(r.price)}</div>
      <span class="chip ${chip[0]}">${chip[1]}</span>
      ${r.source==="walkin"?'<span class="chip" style="margin-left:5px">Dükkândan</span>':""}
    </div></button>`;
}

function gunPaneli(tarih){
  const gun = S.randevular.filter(r=>r.date===tarih).sort((a,b)=>toMin(a.time)-toMin(b.time));
  const a = gun.filter(aktif);
  const kapali = S.gunler[tarih]?.closed;
  return `
    <h3 style="font-size:15px;margin-bottom:12px">${trTarih(tarih)}</h3>
    <div class="grid3" style="margin-bottom:14px">
      <div class="stat"><div class="k">Randevu</div><div class="v">${a.length}</div></div>
      <div class="stat"><div class="k">Onaylı ciro</div><div class="v">${tl(a.filter(r=>r.status==="confirmed").reduce((t,r)=>t+r.price,0))}</div></div>
      <div class="stat"><div class="k">Mesai</div><div class="v">${saatMetni(a.reduce((t,r)=>t+r.minutes,0))}</div></div>
    </div>
    ${kapali?'<p class="warn" style="margin-bottom:12px">Bu gün kapalı olarak ayarlı.</p>':""}
    ${gun.length===0 ? `<p class="note">Bu gün için randevu yok.</p>` : gun.map(randevuSatir).join("")}
    <button class="btn ghost sm" style="width:100%;margin-top:10px" data-act="slot-temizle" data-tarih="${tarih}">
      Dolu görünen boş saatleri temizle</button>
    <p class="note" style="margin-top:6px">Silinmiş randevulardan kalan saat kayıtlarını siler.
    Gerçek randevusu olan saatlere dokunmaz.</p>
    ${manuelEkle(tarih)}`;
}

function manuelEkle(tarih){
  if (!B.ekleAcik) return `<button class="btn ghost" style="margin-top:14px" data-act="ekle-ac">+ Dükkâna gelen müşteriyi ekle</button>`;
  return `<div class="card" style="margin-top:14px">
    <h3 style="font-size:14px;margin-bottom:12px">Randevu ekle · ${trKisa(tarih)}</h3>
    <label class="lbl">Hizmet</label>
    <select class="inp" id="e-hizmet">${S.hizmetler.map(h=>`<option value="${h.id}">${esc(h.name)} (${h.minutes} dk)</option>`).join("")}</select>
    <label class="lbl">Saat</label>
    <input class="inp" id="e-saat" type="time" step="900">
    <label class="lbl">Ad soyad</label>
    <input class="inp" id="e-ad" placeholder="Müşteri adı">
    <label class="lbl">Telefon (kişi geçmişi için önerilir)</label>
    <input class="inp" id="e-tel" inputmode="tel" placeholder="05xx xxx xx xx">
    <div class="row">
      <button class="btn" data-act="ekle-kaydet" data-tarih="${tarih}">Kaydet</button>
      <button class="btn ghost" data-act="ekle-kapat">Vazgeç</button>
    </div>
  </div>`;
}

function takvimPaneli(){
  const ay=B.ay, ilk=ay.getDay(), adet=new Date(ay.getFullYear(),ay.getMonth()+1,0).getDate();
  const hucre=[...Array(ilk).fill(null),...Array.from({length:adet},(_,i)=>i+1)];
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <button class="btn ghost sm" data-act="ay" data-y="-1">‹</button>
      <h3 style="font-size:16px">${AYLAR[ay.getMonth()]} ${ay.getFullYear()}</h3>
      <button class="btn ghost sm" data-act="ay" data-y="1">›</button>
    </div>
    <div class="cal" style="margin-bottom:18px">
      ${GUN_KISA.map(g=>`<div class="hd">${g}</div>`).join("")}
      ${hucre.map(n=>{
        if(!n) return `<div class="cd bos"></div>`;
        const key=ymd(new Date(ay.getFullYear(),ay.getMonth(),n));
        const say=S.randevular.filter(r=>r.date===key&&aktif(r)).length;
        const kap=S.gunler[key]?.closed;
        return `<button class="cd ${B.secili===key?"on":""} ${kap?"kapali":""}" data-act="gun-sec" data-key="${key}">
          <span class="n">${n}</span>${say?'<span class="dot"></span>':""}</button>`;
      }).join("")}
    </div>
    ${(() => { const g=S.gunler[B.secili];
      return `<button class="btn ghost sm" style="width:100%;margin-bottom:12px" data-act="gun-kapat" data-key="${B.secili}">
        ${g?.closed ? "Bu günü aç (şu an kapalı)" : "Bu günü kapat (tatil, izin, bayram)"}</button>`; })()}
    ${gunPaneli(B.secili)}`;
}

function aralikSecici(){
  return `<div class="card" style="margin-bottom:14px">
    <div class="row" style="margin-bottom:10px">
      <button class="btn ghost sm" style="flex:1" data-act="preset" data-p="gun">Bugün</button>
      <button class="btn ghost sm" style="flex:1" data-act="preset" data-p="hafta">Bu hafta</button>
      <button class="btn ghost sm" style="flex:1" data-act="preset" data-p="ay">Bu ay</button>
    </div>
    <div class="row">
      <div style="flex:1"><label class="lbl">Başlangıç</label><input type="date" class="inp" id="a-bas" value="${B.bas}"></div>
      <div style="flex:1"><label class="lbl">Bitiş</label><input type="date" class="inp" id="a-bit" value="${B.bit}"></div>
    </div>
  </div>`;
}
const aralikta = () => S.randevular.filter(r=>r.date>=B.bas && r.date<=B.bit);

function raporPaneli(){
  const k=aralikta(), onayli=k.filter(r=>r.status==="confirmed"), bekleyen=k.filter(r=>r.status==="pending");
  const toplam=onayli.reduce((t,r)=>t+r.price,0);
  const gunSayisi=Math.max(1, Math.round((parseYmd(B.bit)-parseYmd(B.bas))/86400000)+1);
  const dagilim={}; onayli.forEach(r=>{ const d=dagilim[r.serviceName]??={adet:0,tutar:0}; d.adet++; d.tutar+=r.price; });
  const gunler={}; onayli.forEach(r=>{ const d=gunler[r.date]??={adet:0,tutar:0}; d.adet++; d.tutar+=r.price; });
  return `${aralikSecici()}
    <div class="grid3" style="margin-bottom:10px">
      <div class="stat"><div class="k">Toplam gelir</div><div class="v">${tl(toplam)}</div></div>
      <div class="stat"><div class="k">Hizmet</div><div class="v">${onayli.length}</div></div>
      <div class="stat"><div class="k">Günlük ort.</div><div class="v">${tl(toplam/gunSayisi)}</div></div>
    </div>
    ${bekleyen.length?`<p class="warn" style="margin-bottom:14px">${bekleyen.length} randevu onay bekliyor, gelire dahil edilmedi.</p>`:""}
    <h3 style="font-size:14px;margin:16px 0 8px">Hizmet dağılımı</h3>
    <div class="card">${Object.keys(dagilim).length===0?'<p class="note">Bu aralıkta onaylı hizmet yok.</p>':
      Object.entries(dagilim).map(([ad,v])=>`<div class="tr"><span>${esc(ad)} × ${v.adet}</span><b>${tl(v.tutar)}</b></div>`).join("")}</div>
    <h3 style="font-size:14px;margin:20px 0 8px">Gün gün ciro</h3>
    <div class="card">${Object.keys(gunler).length===0?'<p class="note">Kayıt yok.</p>':
      Object.entries(gunler).sort((a,b)=>b[0].localeCompare(a[0])).map(([t,v])=>`<div class="tr"><span>${trKisa(t)} · ${v.adet} hizmet</span><b>${tl(v.tutar)}</b></div>`).join("")}</div>`;
}

function mesaiPaneli(){
  const k=aralikta().filter(aktif);
  const gunler={}; k.forEach(r=>{ gunler[r.date]=(gunler[r.date]||0)+r.minutes; });
  const toplam=k.reduce((t,r)=>t+r.minutes,0);
  const calisilan=Object.keys(gunler).length;
  const gunSayisi=Math.max(1, Math.round((parseYmd(B.bit)-parseYmd(B.bas))/86400000)+1);
  return `${aralikSecici()}
    <div class="grid2" style="margin-bottom:10px">
      <div class="stat"><div class="k">Toplam mesai</div><div class="v">${saatMetni(toplam)}</div></div>
      <div class="stat"><div class="k">Çalışılan gün</div><div class="v">${calisilan}</div></div>
    </div>
    <div class="grid3">
      <div class="stat"><div class="k">Günlük ort.</div><div class="v">${saatMetni(Math.round(toplam/Math.max(1,calisilan)))}</div></div>
      <div class="stat"><div class="k">Haftalık ort.</div><div class="v">${saatMetni(Math.round(toplam/Math.max(1,gunSayisi/7)))}</div></div>
      <div class="stat"><div class="k">Aylık ort.</div><div class="v">${saatMetni(Math.round(toplam/Math.max(1,gunSayisi/30)))}</div></div>
    </div>
    <p class="note" style="margin:10px 0 18px">Mesai, hizmet sürelerinin toplamıdır. İptaller sayılmaz.</p>
    <div class="card">${calisilan===0?'<p class="note">Bu aralıkta kayıt yok.</p>':
      Object.entries(gunler).sort((a,b)=>b[0].localeCompare(a[0])).map(([t,dk])=>`<div class="tr"><span>${trKisa(t)} · ${GUNLER[parseYmd(t).getDay()]}</span><b>${saatMetni(dk)}</b></div>`).join("")}</div>`;
}

function kisiler(){
  const m={}, bg=bugun();
  S.randevular.filter(aktif).forEach(r=>{
    const anahtar=(r.phone||"").replace(/\D/g,"") || r.name.toLocaleLowerCase("tr").trim();
    const k = m[anahtar] ??= {anahtar,ad:"",tel:"",ziyaret:0,tutar:0,son:null,ilk:null,yaklasan:null,kayitlar:[]};
    k.kayitlar.push(r);
    if (r.date<=bg){ k.ziyaret++; k.tutar+=r.price;
      if(!k.son||r.date>k.son) k.son=r.date;
      if(!k.ilk||r.date<k.ilk) k.ilk=r.date;
    } else if(!k.yaklasan||r.date<k.yaklasan) k.yaklasan=r.date;
    if(!k.ad||r.date>=(k.son||"")){ k.ad=r.name; k.tel=r.phone||k.tel; }
  });
  return Object.values(m).map(k=>({...k,kayitlar:k.kayitlar.sort((a,b)=>b.date.localeCompare(a.date)||toMin(b.time)-toMin(a.time))}))
    .sort((a,b)=>(b.son||b.yaklasan||"").localeCompare(a.son||a.yaklasan||""));
}

function musteriPaneli(){
  const bas = `<div class="row" style="margin-bottom:14px">
    <button class="btn sm ${B.mGorunum==="kisi"?"":"ghost"}" style="flex:1" data-act="mgor" data-g="kisi">Kişi kişi</button>
    <button class="btn sm ${B.mGorunum==="gun"?"":"ghost"}" style="flex:1" data-act="mgor" data-g="gun">Gün gün</button></div>`;

  if (B.mGorunum==="gun"){
    const k=aralikta().filter(aktif), gunler={};
    k.forEach(r=>{ (gunler[r.date] ??= []).push(r); });
    return bas + aralikSecici() +
      (Object.keys(gunler).length===0 ? '<p class="note">Bu aralıkta müşteri kaydı yok.</p>' :
      Object.entries(gunler).sort((a,b)=>b[0].localeCompare(a[0])).map(([t,l])=>`
        <div style="margin-bottom:18px"><h3 style="font-size:13px;margin-bottom:8px;color:var(--brass)">${trTarih(t)}</h3>
        <div class="card">${l.sort((p,q)=>toMin(p.time)-toMin(q.time)).map(r=>
          `<div class="tr"><span>${r.time} · ${esc(r.name)}${r.phone?` · ${esc(r.phone)}`:""}</span><b>${esc(r.serviceName)}</b></div>`).join("")}</div></div>`).join(""));
  }

  const hepsi=kisiler(), q=B.ara.toLocaleLowerCase("tr"), bg=bugun();
  const liste=hepsi.filter(k=>!q||k.ad.toLocaleLowerCase("tr").includes(q)||(k.tel||"").includes(B.ara));
  return bas + `
    <div class="grid3" style="margin-bottom:12px">
      <div class="stat"><div class="k">Kayıtlı kişi</div><div class="v">${hepsi.length}</div></div>
      <div class="stat"><div class="k">Düzenli</div><div class="v">${hepsi.filter(k=>k.ziyaret>=3).length}</div></div>
      <div class="stat"><div class="k">Toplam ziyaret</div><div class="v">${hepsi.reduce((t,k)=>t+k.ziyaret,0)}</div></div>
    </div>
    <input class="inp" id="i-ara" value="${esc(B.ara)}" placeholder="İsim veya telefon ara">
    ${liste.length===0 ? `<p class="note">${hepsi.length===0?"Henüz müşteri kaydı yok.":"Aramaya uyan kişi yok."}</p>` :
    liste.map(k=>`
      <div style="margin-bottom:8px">
        <button class="ap" style="margin-bottom:0" data-act="kisi" data-k="${esc(k.anahtar)}">
          <div class="tm" style="font-size:15px;min-width:46px">${k.ziyaret}<small>ziyaret</small></div>
          <div style="flex:1">
            <div class="nm">${esc(k.ad)}</div>
            <div class="sb">${k.son?`Son geliş: ${trKisa(k.son)} · ${gecenGun(k.son)}`:"Henüz gelmedi"}</div>
            <div class="sb">${esc(k.tel||"Telefon yok")} · Toplam ${tl(k.tutar)}</div>
            ${k.yaklasan?`<span class="chip b">Yaklaşan: ${trKisa(k.yaklasan)}</span>`:""}
          </div>
        </button>
        ${B.acikKisi===k.anahtar?`<div class="card" style="margin-top:6px">
          <div class="tr"><span>İlk geliş</span><b>${k.ilk?trKisa(k.ilk):"—"}</b></div>
          <div class="tr"><span>Ortalama harcama</span><b>${tl(k.ziyaret?k.tutar/k.ziyaret:0)}</b></div>
          <h3 style="font-size:12px;margin:12px 0 6px;color:var(--brass)">Geçmiş</h3>
          ${k.kayitlar.map(r=>`<div class="tr"><span>${trKisa(r.date)} · ${r.time}${r.date>bg?" (yaklaşan)":""}</span><b>${esc(r.serviceName)} · ${tl(r.price)}</b></div>`).join("")}
        </div>`:""}
      </div>`).join("")}`;
}

function ayarPaneli(){
  return `
    <h3 style="font-size:14px;margin-bottom:10px">Hizmetler, süre ve ücret</h3>
    ${S.hizmetler.map(h=>`
      <div class="card" style="margin-bottom:9px">

async function saatleriGetir(){
  M.slotYukleniyor = true; M.slotlar = []; M.hata = ""; ciz();
  try {
    const h = S.hizmetler.find(x=>x.id===M.hizmetId);
    const g = S.gunler[M.tarih];
    if (!h || !g || g.closed) { M.slotlar=[]; M.slotYukleniyor=false; return ciz(); }

    const snap = await getDocs(query(collection(db,"slots"), where("date","==",M.tarih)));
    const dolu = new Set(snap.docs.map(d=>d.data().time));

    const ac=toMin(g.open), kapa=toMin(g.close);
    const bg=bugun(), simdi=new Date().getHours()*60+new Date().getMinutes();
    const liste=[];
    for(let t=ac; t+h.minutes<=kapa; t+=15){
      let bos=true;
      for(let k=t; k<t+h.minutes; k+=15) if(dolu.has(fromMin(k))) { bos=false; break; }
      if (M.tarih===bg && t<=simdi) bos=false;
      liste.push({ time:fromMin(t), free:bos });
    }
    M.slotlar=liste;
  } catch(e){
    console.error("Müsaitlik hatası:", e.code, e.message);
    M.hata = /permission/i.test(e.code||"") ? "Güvenlik kuralları henüz güncellenmemiş görünüyor."
           : "Saatler getirilemedi, sayfayı yenileyip tekrar deneyin.";
  }
  M.slotYukleniyor = false; ciz();
}

document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("[data-act]"); if(!t) return;
  const act = t.dataset.act;
  if (act==="hicbirsey") return;   // pencere içindeki tıklama dışarı sızmasın

  /* müşteri */
  if (act==="hizmet"){ M.hizmetId=t.dataset.id; M.saat=null; M.hata=""; if(M.tarih) await saatleriGetir(); else ciz(); return; }
  if (act==="gun"){ M.tarih=t.dataset.key; M.saat=null; M.hata=""; await saatleriGetir(); return; }
  if (act==="saat"){ M.saat=t.dataset.t; M.hata=""; ciz(); return; }
  if (act==="gonder"){ await randevuGonder(); return; }
  if (act==="ozet-kapat"){ Object.assign(M,{hizmetId:null,tarih:null,saat:null,slotlar:[],ad:"",soyad:"",tel:"",kvkk:false,ozet:null,hata:""}); ciz(); return; }
  if (act==="kvkk-ac"){ M.kvkkAcik=true; ciz(); return; }
  if (act==="kvkk-kapat"){ M.kvkkAcik=false; ciz(); return; }
  if (act==="giris-ac"){ S.ekran="giris"; girisHata=""; ciz(); return; }
  if (act==="giris-iptal"){ S.ekran="musteri"; ciz(); return; }
  if (act==="giris"){ await girisYap(); return; }
  if (act==="cikis"){ await signOut(auth); S.admin=false; S.ekran="musteri"; ciz(); return; }

  /* berber */
  if (act==="sekme"){ B.sekme=t.dataset.k; B.ekleAcik=false; ciz(); return; }
  if (act==="gun-sec"){ B.secili=t.dataset.key; ciz(); return; }
  if (act==="ay"){ B.ay=new Date(B.ay.getFullYear(), B.ay.getMonth()+Number(t.dataset.y), 1); ciz(); return; }
  if (act==="detay"){ B.detay=t.dataset.id; ciz(); return; }
  if (act==="modal-kapat"){ B.detay=null; B.sifirlaMod=null; ciz(); return; }
  if (act==="onayla" || act==="iptal"){
    const id=t.dataset.id, r=S.randevular.find(x=>x.id===id);
    if (act==="iptal"){
      const batch=writeBatch(db);
      batch.update(doc(db,"appointments",id), { status:"cancelled" });
      if (r) for(let k=toMin(r.time); k<toMin(r.time)+r.minutes; k+=15)
        batch.delete(doc(db,"slots",`${r.date}_${fromMin(k).replace(":","")}`));
      await batch.commit();
      if(r) r.status="cancelled";
    } else {
      await updateDoc(doc(db,"appointments",id), { status:"confirmed" });
      if(r) r.status="confirmed";
    }
    B.detay=null; ciz(); return;
  }
  if (act==="engelle"){
    const tel=(t.dataset.tel||"").replace(/\D/g,"");
    if(!tel||!confirm("Bu numaradan yeni online randevu alınamayacak. Onaylıyor musunuz?")) return;
    await setDoc(doc(db,"blocklist",tel), { addedAt: serverTimestamp() });
    alert("Numara engellendi."); B.detay=null; ciz(); return;
  }
  if (act==="gun-kapat"){
    const key=t.dataset.key;
    const s=S.saatler[parseYmd(key).getDay()] || {open:"09:00", close:"20:00"};
    const g=S.gunler[key] || { date:key, closed:false, open:s.open, close:s.close };
    const yeni={ ...g, date:key, closed:!g.closed, manuel:true };
    await setDoc(doc(db,"days",key), yeni);
    S.gunler[key]=yeni; ciz(); return;
  }
  if (act==="slot-temizle"){ await slotTemizle(t.dataset.tarih); return; }
  if (act==="ekle-ac"){ B.ekleAcik=true; ciz(); return; }
  if (act==="ekle-kapat"){ B.ekleAcik=false; ciz(); return; }
  if (act==="ekle-kaydet"){ await manuelKaydet(t.dataset.tarih); return; }
  if (act==="preset"){ preset(t.dataset.p); ciz(); return; }
  if (act==="mgor"){ B.mGorunum=t.dataset.g; B.acikKisi=null; ciz(); return; }
  if (act==="kisi"){ B.acikKisi = B.acikKisi===t.dataset.k ? null : t.dataset.k; ciz(); return; }
  if (act==="hizmet-kaydet"){ await hizmetKaydet(t.dataset.id); return; }
  if (act==="hizmet-sil"){ await hizmetSil(t.dataset.id); return; }
  if (act==="hizmet-ekle"){ await hizmetEkle(); return; }
  if (act==="gun-toggle"){ await gunToggle(Number(t.dataset.g)); return; }
  if (act==="saat-kaydet"){ await saatKaydet(); return; }
  if (act==="dukkan-kaydet"){ await dukkanKaydet(); return; }
  if (act==="sifre"){ await sifreDegistir(); return; }
  if (act==="sifirla-mod"){ B.sifirlaMod=t.dataset.m; ciz(); return; }
  if (act==="sifirla-uygula"){ await sifirlaUygula(); return; }
});

function preset(p){
  const b=new Date(); b.setHours(0,0,0,0);
  if(p==="gun"){ B.bas=B.bit=ymd(b); }
  if(p==="hafta"){ const g=(b.getDay()+6)%7; const s=new Date(b); s.setDate(b.getDate()-g);
    const e=new Date(s); e.setDate(s.getDate()+6); B.bas=ymd(s); B.bit=ymd(e); }
  if(p==="ay"){ B.bas=ymd(new Date(b.getFullYear(),b.getMonth(),1)); B.bit=ymd(new Date(b.getFullYear(),b.getMonth()+1,0)); }
}

async function randevuGonder(){
  M.hata="";
  const ad=`${M.ad} ${M.soyad}`.trim();
  const tel=M.tel.replace(/\D/g,"");
  if (ad.length<3) return (M.hata="Ad ve soyadınızı yazın.", ciz());
  if (tel.length<10) return (M.hata="Telefon numarası eksik görünüyor.", ciz());
  if (!M.kvkk) return (M.hata="Devam etmek için onay kutusunu işaretleyin.", ciz());
  const h=S.hizmetler.find(x=>x.id===M.hizmetId);
  if(!h) return (M.hata="Hizmet bulunamadı.", ciz());

  M.gonderiliyor=true; ciz();
  const apptId = doc(collection(db,"appointments")).id;
  const bas = toMin(M.saat);
  const bloklar = []; for(let k=bas; k<bas+h.minutes; k+=15) bloklar.push(fromMin(k));

  try {
    const batch = writeBatch(db);
    batch.set(doc(db,"appointments",apptId), {
      date:M.tarih, time:M.saat, minutes:h.minutes,
      serviceId:h.id, serviceName:h.name, price:h.price,
      name:ad, phone:tel, status:"pending", source:"online",
      createdAt:serverTimestamp()
    });
    bloklar.forEach(t => batch.set(doc(db,"slots",`${M.tarih}_${t.replace(":","")}`), {
      date:M.tarih, time:t, apptId
    }));
    await batch.commit();
    M.ozet={ id:apptId, date:M.tarih, time:M.saat, minutes:h.minutes,
             name:ad, serviceName:h.name, price:h.price };
  } catch(e){
    console.error("Randevu hatası:", e.code, e.message);
    let dolmus=false;
    try {
      const kontrol = await getDocs(query(collection(db,"slots"), where("date","==",M.tarih)));
      const set = new Set(kontrol.docs.map(d=>d.data().time));
      dolmus = bloklar.some(x=>set.has(x));
    } catch {}
    if (dolmus) { M.hata="Bu saat az önce doldu, lütfen başka bir saat seçin."; M.saat=null; await saatleriGetir(); }
    else if (/permission/i.test(e.code||"")) M.hata="Kayıt reddedildi. Güvenlik kurallarının güncel sürümü yayınlanmamış olabilir.";
    else M.hata="Randevu gönderilemedi, tekrar deneyin.";
  }
  M.gonderiliyor=false; ciz();
}

async function manuelKaydet(tarih){
  const hid=$("#e-hizmet")?.value, ad=$("#e-ad")?.value.trim()||"", tel=$("#e-tel")?.value.trim()||"";
  let saat=$("#e-saat")?.value;
  const h=S.hizmetler.find(x=>x.id===hid);
  if(!h||!saat||ad.length<2) return alert("Hizmet, saat ve ad soyad gerekli.");
  /* DÜZELTME: saat 15 dakikalık ızgaraya oturtulmalı. Aksi halde 14:37 gibi
     bir saatte slot kimlikleri kaymış olur ve müşteri o saati dolu göremez. */
  saat = fromMin(Math.round(toMin(saat)/15)*15);
  const cak=S.randevular.some(r=>r.date===tarih&&aktif(r)&&toMin(r.time)<toMin(saat)+h.minutes&&toMin(saat)<toMin(r.time)+r.minutes);
  if(cak && !confirm("Bu saatte başka randevu var. Yine de eklensin mi?")) return;
  const kayit={date:tarih,time:saat,minutes:h.minutes,serviceId:h.id,serviceName:h.name,price:h.price,
    name:ad,phone:tel,status:"confirmed",source:"walkin",createdAt:serverTimestamp()};
  const id = doc(collection(db,"appointments")).id;
  const batch = writeBatch(db);
  batch.set(doc(db,"appointments",id), kayit);
  for(let k=toMin(saat); k<toMin(saat)+h.minutes; k+=15)
    batch.set(doc(db,"slots",`${tarih}_${fromMin(k).replace(":","")}`), { date:tarih, time:fromMin(k), apptId:id });
  try { await batch.commit(); }
  catch(e){ console.error(e); return alert("Kaydedilemedi: " + (e.code||e.message)); }
  S.randevular.push({id,...kayit});
  B.ekleAcik=false; ciz();
}

/* Öksüz slot temizliği: randevusu kalmamış saat kayıtlarını siler.
   Eski sürümde randevu silinince slotlar kalıyordu ve o saatler kalıcı dolu görünüyordu. */
async function slotTemizle(tarih){
  try {
    const snap = await getDocs(query(collection(db,"slots"), where("date","==",tarih)));
    if (snap.empty) return alert("Bu güne ait saat kaydı yok.");

    // Gerçekten randevusu olan saatler
    const gecerli = new Set();
    S.randevular.filter(r=>r.date===tarih && aktif(r)).forEach(r=>{
      for(let k=toMin(r.time); k<toMin(r.time)+r.minutes; k+=15) gecerli.add(fromMin(k));
    });

    const oksuz = snap.docs.filter(d => !gecerli.has(d.data().time));
    if (!oksuz.length) return alert("Temizlenecek kayıt yok. Dolu görünen saatlerin hepsinin gerçek randevusu var.");
    if (!confirm(oksuz.length + " adet boşta kalmış saat kaydı silinecek. Onaylıyor musunuz?")) return;

    for(let i=0;i<oksuz.length;i+=100){
      const b=writeBatch(db);
      oksuz.slice(i,i+100).forEach(d=>b.delete(doc(db,"slots",d.id)));
      await b.commit();
    }
    alert(oksuz.length + " saat serbest bırakıldı.");
    ciz();
  } catch(e){
    console.error(e);
    alert("Temizlenemedi: " + (e.code||e.message));
  }
}

async function gunToggle(g){
  const s=S.saatler[g]||{closed:true,open:"09:00",close:"20:00"};
  const yeni={...s, closed:!s.closed};
  await setDoc(doc(db,"workingHours",String(g)), yeni);
  S.saatler[g]=yeni; ciz();
}
async function saatKaydet(){
  const batch=writeBatch(db);
  [0,1,2,3,4,5,6].forEach(g=>{
    const s=S.saatler[g]||{closed:true,open:"09:00",close:"20:00"};
    const o=document.querySelector(`[data-wd="${g}"][data-f="open"]`)?.value||s.open;
    const c=document.querySelector(`[data-wd="${g}"][data-f="close"]`)?.value||s.close;
    // 15 dakikalık ızgaraya oturt: slot kimlikleri buna göre üretiliyor
    const yeni={ closed:!!s.closed,
                 open:  fromMin(Math.round(toMin(o)/15)*15),
                 close: fromMin(Math.round(toMin(c)/15)*15) };
    S.saatler[g]=yeni;
    batch.set(doc(db,"workingHours",String(g)), yeni);
  });
  await batch.commit();
  await gunleriUret();
  alert("Çalışma saatleri kaydedildi ve takvim güncellendi.");
}
async function dukkanKaydet(){
  const ad=$("#i-dukkan")?.value.trim()||"Berber";
  await setDoc(doc(db,"shop","settings"), { name:ad }, { merge:true });
  S.dukkan=ad; ciz();
}
async function sifreDegistir(){
  const eski=$("#s-eski").value, yeni=$("#s-yeni").value, tekrar=$("#s-tekrar").value, d=$("#s-durum");
  const yaz=(m,k)=>{ d.textContent=m; d.className=k?"note":"warn"; };
  if(yeni.length<8) return yaz("Yeni şifre en az 8 karakter olmalı.");
  if(yeni!==tekrar) return yaz("Yeni şifreler birbirini tutmuyor.");
  try{
    const u=auth.currentUser;
    await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, eski));
    await updatePassword(u, yeni);
    yaz("Şifre değiştirildi.", true);
    $("#s-eski").value=$("#s-yeni").value=$("#s-tekrar").value="";
  }catch(e){ yaz("Mevcut şifre hatalı ya da yeni şifre zayıf."); }
}

/* DÜZELTME: eskiden sadece randevular siliniyor, kapattıkları saatler
   (slots) kalıyordu. O saatler sonsuza kadar dolu görünüyordu. */
async function sifirlaUygula(){
  const o=($("#i-onay")?.value||"").trim().toUpperCase();
  if(o!=="SIFIRLA"&&o!=="SİFİRLA"){ alert("Onaylamak için kutuya SIFIRLA yazın."); return; }
  const hedef = B.sifirlaMod==="aralik" ? S.randevular.filter(r=>r.date>=B.bas&&r.date<=B.bit) : S.randevular.slice();
  try {
    for(let i=0;i<hedef.length;i+=100){
      const b=writeBatch(db);
      hedef.slice(i,i+100).forEach(r=>{
        b.delete(doc(db,"appointments",r.id));
        for(let k=toMin(r.time); k<toMin(r.time)+r.minutes; k+=15)
          b.delete(doc(db,"slots",`${r.date}_${fromMin(k).replace(":","")}`));
      });
      await b.commit();
    }
  } catch(e){ console.error(e); alert("Silme sırasında hata: " + (e.code||e.message)); return; }
  const sil=new Set(hedef.map(r=>r.id));
  S.randevular=S.randevular.filter(r=>!sil.has(r.id));
  B.sifirlaMod=null; ciz();
  alert(hedef.length + " randevu silindi.");
}

let bosZamanlayici;
function bosSayaciKur(){
  clearTimeout(bosZamanlayici);
  if(!S.admin) return;
  bosZamanlayici = setTimeout(async ()=>{
    if(S.admin){ await signOut(auth); S.admin=false; S.ekran="musteri"; ciz(); }
  }, 20*60*1000);
}
["click","keydown","touchstart"].forEach(e=>document.addEventListener(e, bosSayaciKur, {passive:true}));
